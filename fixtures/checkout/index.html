<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout fixture</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <form id="checkout-form" action="./submit" method="post">
        <label for="cardNumber">Card number</label
        ><input
          id="cardNumber"
          name="cardNumber"
          inputmode="numeric"
          pattern="[0-9]{16}"
          required
          autocomplete="cc-number"
        />
        <label for="postalCode">Postal code</label
        ><input
          id="postalCode"
          name="postalCode"
          inputmode="numeric"
          pattern="[0-9]{6}"
          required
          autocomplete="postal-code"
        />
        <label for="country">Country</label
        ><select id="country" name="country" required autocomplete="country">
          <option value="US">United States</option>
          <option value="CA">Canada</option>
        </select>
        <button type="submit"><span aria-hidden="true">Pay</span></button>
      </form>
      <p id="form-status" data-outcome="" role="status"></p>
    </main>
  </body>
</html>
