name: Bug report
description: Report a reproducible defect in FormStorm Lab
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed and replay command
      description: Redact any sensitive value before sharing.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Attach the minimal case, logs, screenshot, or trace when safe.
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization
      options:
        - label: I was authorized to test the target and removed secrets or personal data.
          required: true
